[tools]
go = "latest"

[tasks.build]
description = "Build the gdviz binary → bin/gdviz"
run = "go build -ldflags \"-s -w\" -o bin/gdviz ."

[tasks.test]
description = "Go unit tests (diff engine)"
run = "go test ./..."

[tasks.check]
description = "go vet + go test + build"
run = "go vet ./... && go test ./... && go build -o bin/gdviz ."
